[package]
name = "plausiden-tidy"
version = "0.2.0"
edition = "2024"
description = "Smart filesystem tidying library: duplicate detection, age/size analysis, importance-aware classification, and reviewable cleanup plans. GUI lives in PlausiDen-Atrium."
license = "AGPL-3.0-or-later"
repository = "https://github.com/redcaptian1917/PlausiDen-Tidy"
readme = "README.md"
keywords = ["cleanup", "duplicates", "privacy", "plausiden"]
categories = ["filesystem", "command-line-utilities"]

[lib]
name = "plausiden_tidy"
path = "src/lib.rs"

[[bin]]
name = "tidy"
path = "src/bin/tidy.rs"

[dependencies]
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
