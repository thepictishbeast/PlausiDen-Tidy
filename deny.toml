# cargo-deny configuration — PlausiDen Tidy (smart filesystem cleaner
# with importance-aware safety classifier).
#
# Uniform PlausiDen policy (authored 2026-04-19, Claude 3):
# - vulnerability=deny, unmaintained/unsound/yanked=warn.
# - deny unlicensed + copyleft; allow permissive set.
# - Every dep must come from crates.io.
# - rustls-first posture — no openssl / native-tls / curl / git2.
#
# Tidy-specific concern: Tidy can delete files. A compromised dep
# could exfiltrate the "about to be deleted" list or route deletes
# through an adversarial path. Hold new deps to Purge's bar.

[advisories]
version = 2
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl-sys" },
    { name = "openssl" },
    { name = "native-tls" },
    { name = "git2" },
    { name = "curl" },
    { name = "curl-sys" },
]
